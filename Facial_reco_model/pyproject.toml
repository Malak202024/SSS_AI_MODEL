[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-security"
version = "0.2.0"
description = "Production-grade Edge & IoT Smart Security System"
authors = [{ name = "Malak Ahmed" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "paho-mqtt>=2.0.0",
    "scikit-learn",
    "tensorflow"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "mlflow>=2.11.0",
    "dvc>=3.48.0"
]

[tool.setuptools.packages.find]
where = ["src"]